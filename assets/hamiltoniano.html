<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciclo Hamiltoniano</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0a0a0f;
            --surface: #13131a;
            --surface-2: #1a1a24;
            --surface-3: #22222e;
            --border: #2a2a3a;
            --border-hover: #3a3a50;
            --text: #e8e8f0;
            --text-dim: #8888a0;
            --text-muted: #555568;
            --accent: #6c5ce7;
            --accent-light: #a29bfe;
            --accent-glow: rgba(108, 92, 231, 0.15);
            --accent-glow-strong: rgba(108, 92, 231, 0.3);
            --success: #00cec9;
            --success-glow: rgba(0, 206, 201, 0.15);
            --warning: #fdcb6e;
            --danger: #ff6b6b;
            --radius: 12px;
            --radius-sm: 8px;
            --radius-xs: 6px;
            --font: 'DM Sans', sans-serif;
            --mono: 'JetBrains Mono', monospace;
        }
        html, body { height: 100%; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Navbar */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            height: 56px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text);
            text-decoration: none;
        }
        .brand-icon {
            width: 32px; height: 32px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; color: white; font-weight: 700;
        }
        .nav-meta {
            display: flex; align-items: center; gap: 12px;
        }
        .badge {
            padding: 4px 10px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-family: var(--mono);
            font-size: 0.75rem;
            color: var(--text-dim);
        }
        .back-link {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: var(--radius-xs);
            transition: all 0.2s;
        }
        .back-link:hover { color: var(--text); background: var(--surface-2); }

        /* Main */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 20px 24px;
            gap: 16px;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 16px;
            font-family: var(--font);
            font-size: 0.82rem;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-xs);
            cursor: pointer;
            transition: all 0.15s;
            user-select: none;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: #5b4bd6; box-shadow: 0 2px 12px var(--accent-glow-strong); }
        .btn-secondary { background: var(--surface-3); color: var(--text-dim); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--border); color: var(--text); }
        .btn-danger { background: rgba(255,107,107,0.12); color: var(--danger); border: 1px solid rgba(255,107,107,0.2); }
        .btn-danger:hover { background: rgba(255,107,107,0.2); }
        .btn-success { background: rgba(0,206,201,0.12); color: var(--success); border: 1px solid rgba(0,206,201,0.2); }
        .btn-success:hover { background: rgba(0,206,201,0.2); }
        .btn.active { outline: 2px solid var(--accent); outline-offset: 1px; }
        .toolbar-sep { width: 1px; height: 28px; background: var(--border); margin: 0 4px; }

        .input-field {
            height: 36px;
            padding: 0 10px;
            font-family: var(--mono);
            font-size: 0.82rem;
            background: var(--surface-3);
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            color: var(--text);
            outline: none;
            width: 72px;
            text-align: center;
            transition: border-color 0.15s;
        }
        .input-field:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
        .input-field::placeholder { color: var(--text-muted); font-family: var(--font); font-size: 0.75rem; }

        /* Status bar */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            flex-shrink: 0;
        }
        .status-indicator {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .status-indicator.green { background: var(--success); }
        .status-indicator.yellow { background: var(--warning); }
        .status-text {
            font-size: 0.82rem;
            color: var(--text-dim);
        }
        .status-text strong {
            color: var(--text);
            font-weight: 600;
        }
        .status-right {
            margin-left: auto;
            display: flex;
            gap: 16px;
            font-family: var(--mono);
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Canvas */
        .canvas-container {
            flex: 1;
            min-height: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            position: relative;
        }
        .canvas-container canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
        .canvas-container.mode-edge canvas { cursor: pointer; }
        .canvas-container .canvas-hint {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 14px;
            background: rgba(10, 10, 15, 0.85);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--text-dim);
            pointer-events: none;
            transition: opacity 0.3s;
        }

        /* Result */
        .result-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 18px;
            background: var(--accent-glow);
            border: 1px solid rgba(108, 92, 231, 0.2);
            border-radius: var(--radius-sm);
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .result-bar.success {
            background: var(--success-glow);
            border-color: rgba(0, 206, 201, 0.2);
        }
        .result-label {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
        }
        .result-value {
            font-family: var(--mono);
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--accent-light);
        }
        .result-bar.success .result-value { color: var(--success); }
        .result-sep {
            width: 1px;
            height: 24px;
            background: var(--border);
        }
        .result-bar.hidden { display: none; }

        /* Edge list panel */
        .edge-list {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(19, 19, 26, 0.92);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            max-height: 200px;
            overflow-y: auto;
            min-width: 130px;
            z-index: 10;
        }
        .edge-list::-webkit-scrollbar { width: 4px; }
        .edge-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        .edge-list-title {
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .edge-item {
            font-family: var(--mono);
            font-size: 0.75rem;
            color: var(--text-dim);
            padding: 3px 0;
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }
        .edge-item .weight { color: var(--warning); }
        .edge-list.empty { display: none; }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="#" class="navbar-brand" onclick="history.back(); return false;">
        <div class="brand-icon">⟳</div>
        Ciclo Hamiltoniano
    </a>
    <div class="nav-meta">
        <span class="badge" id="vertex-count">Vértices: 0</span>
        <span class="badge" id="edge-count">Aristas: 0</span>
        <a href="#" class="back-link" onclick="history.back(); return false;">← Volver</a>
    </div>
</nav>

<div class="main-wrapper">

    <!-- Toolbar -->
    <div class="toolbar">
        <button class="btn btn-primary active" id="btn-vertex" onclick="setMode('vertex')">+ Vértice</button>
        <button class="btn btn-secondary" id="btn-edge" onclick="setMode('edge')">↔ Arista</button>
        <div class="toolbar-sep"></div>
        <div id="edge-inputs" style="display: none; align-items: center; gap: 6px;">
            <input type="text" class="input-field" id="inp-v1" placeholder="V1">
            <span style="color: var(--text-muted);">→</span>
            <input type="text" class="input-field" id="inp-v2" placeholder="V2">
            <input type="text" class="input-field" id="inp-weight" placeholder="Peso">
            <button class="btn btn-primary" onclick="addEdgeFromInputs()">Agregar</button>
        </div>
        <div style="flex: 1;"></div>
        <button class="btn btn-success" onclick="findHamiltonianCycle()">Calcular camino</button>
        <button class="btn btn-secondary" onclick="undoLast()">↩ Deshacer</button>
        <button class="btn btn-danger" onclick="clearGraph()">Limpiar</button>
    </div>

    <!-- Status bar -->
    <div class="status-bar">
        <div class="status-indicator" id="status-dot"></div>
        <div class="status-text" id="status-text">
            <strong>Modo Vértice</strong> — Haz clic en el lienzo para agregar vértices
        </div>
        <div class="status-right">
            <span id="info-vertices">V = 0</span>
            <span id="info-edges">E = 0</span>
        </div>
    </div>

    <!-- Canvas -->
    <div class="canvas-container" id="canvas-container">
        <canvas id="graph-canvas"></canvas>
        <div class="canvas-hint" id="canvas-hint">Haz clic para colocar un vértice</div>
        <!-- Edge list overlay -->
        <div class="edge-list empty" id="edge-list">
            <div class="edge-list-title">Aristas</div>
            <div id="edge-list-items"></div>
        </div>
    </div>

    <!-- Result -->
    <div class="result-bar hidden" id="result-bar">
        <div>
            <div class="result-label">Camino más corto</div>
            <div class="result-value" id="result-path">—</div>
        </div>
        <div class="result-sep"></div>
        <div>
            <div class="result-label">Longitud total</div>
            <div class="result-value" id="result-length">—</div>
        </div>
    </div>
</div>

<script>
// ===== STATE =====
let vertices = [];
let edges = [];
let mode = 'vertex'; // 'vertex' | 'edge'
let selectedVertex = null; // for click-to-connect in edge mode
let history_stack = []; // for undo

const canvas = document.getElementById('graph-canvas');
const ctx = canvas.getContext('2d');
let dpr = window.devicePixelRatio || 1;

function resizeCanvas() {
    const container = document.getElementById('canvas-container');
    const w = container.clientWidth;
    const h = container.clientHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redraw();
}
window.addEventListener('resize', resizeCanvas);
setTimeout(resizeCanvas, 0);

// ===== MODES =====
function setMode(m) {
    mode = m;
    selectedVertex = null;
    document.getElementById('btn-vertex').classList.toggle('active', m === 'vertex');
    document.getElementById('btn-edge').classList.toggle('active', m === 'edge');
    document.getElementById('edge-inputs').style.display = m === 'edge' ? 'flex' : 'none';
    document.getElementById('canvas-container').classList.toggle('mode-edge', m === 'edge');

    const dot = document.getElementById('status-dot');
    const text = document.getElementById('status-text');
    const hint = document.getElementById('canvas-hint');
    if (m === 'vertex') {
        dot.className = 'status-indicator';
        text.innerHTML = '<strong>Modo Vértice</strong> — Haz clic en el lienzo para agregar vértices';
        hint.textContent = 'Haz clic para colocar un vértice';
    } else {
        dot.className = 'status-indicator yellow';
        text.innerHTML = '<strong>Modo Arista</strong> — Haz clic en dos vértices para conectarlos, o usa los campos de abajo';
        hint.textContent = 'Clic en un vértice para iniciar la conexión';
    }
    redraw();
}

// ===== CANVAS INTERACTION =====
canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (mode === 'vertex') {
        history_stack.push({ type: 'vertex', index: vertices.length });
        vertices.push({ x, y, id: vertices.length });
        updateCounts();
        redraw();
    } else if (mode === 'edge') {
        // Find closest vertex within 20px
        const hit = findVertex(x, y);
        if (hit === null) return;

        if (selectedVertex === null) {
            selectedVertex = hit;
            document.getElementById('canvas-hint').textContent = `Vértice ${hit} seleccionado — clic en otro para conectar`;
            redraw();
        } else {
            if (hit !== selectedVertex) {
                promptWeight(selectedVertex, hit);
            }
            selectedVertex = null;
            document.getElementById('canvas-hint').textContent = 'Clic en un vértice para iniciar la conexión';
            redraw();
        }
    }
});

function findVertex(x, y) {
    for (let i = vertices.length - 1; i >= 0; i--) {
        const v = vertices[i];
        const dx = v.x - x, dy = v.y - y;
        if (Math.sqrt(dx * dx + dy * dy) < 22) return i;
    }
    return null;
}

function promptWeight(v1, v2) {
    if (edgeExists(v1, v2)) { alert('Ya existe esa arista'); return; }
    const w = prompt(`Peso de la arista ${v1} → ${v2}:`);
    if (w === null || w.trim() === '') return;
    const weight = parseInt(w);
    if (isNaN(weight)) { alert('Ingrese un número válido'); return; }
    history_stack.push({ type: 'edge', index: edges.length });
    edges.push({ v1, v2, weight });
    updateCounts();
    updateEdgeList();
    redraw();
}

function addEdgeFromInputs() {
    const v1 = parseInt(document.getElementById('inp-v1').value);
    const v2 = parseInt(document.getElementById('inp-v2').value);
    const weight = parseInt(document.getElementById('inp-weight').value);
    if (isNaN(v1) || isNaN(v2) || isNaN(weight)) { alert('Complete todos los campos'); return; }
    if (v1 >= vertices.length || v2 >= vertices.length || v1 < 0 || v2 < 0) { alert('Vértice no existe'); return; }
    if (v1 === v2) { alert('No se permiten lazos'); return; }
    if (edgeExists(v1, v2)) { alert('Ya existe esa arista'); return; }
    history_stack.push({ type: 'edge', index: edges.length });
    edges.push({ v1, v2, weight });
    document.getElementById('inp-v1').value = '';
    document.getElementById('inp-v2').value = '';
    document.getElementById('inp-weight').value = '';
    updateCounts();
    updateEdgeList();
    redraw();
}

function edgeExists(a, b) {
    return edges.some(e => (e.v1 === a && e.v2 === b) || (e.v1 === b && e.v2 === a));
}

function undoLast() {
    if (history_stack.length === 0) return;
    const action = history_stack.pop();
    if (action.type === 'vertex') {
        // Remove vertex and all edges connected to it
        const idx = vertices.length - 1;
        edges = edges.filter(e => e.v1 !== idx && e.v2 !== idx);
        vertices.pop();
    } else if (action.type === 'edge') {
        edges.pop();
    }
    selectedVertex = null;
    updateCounts();
    updateEdgeList();
    redraw();
    document.getElementById('result-bar').classList.add('hidden');
}

function clearGraph() {
    vertices = [];
    edges = [];
    history_stack = [];
    selectedVertex = null;
    highlightEdges = null;
    updateCounts();
    updateEdgeList();
    redraw();
    document.getElementById('result-bar').classList.add('hidden');
}

// ===== DRAWING =====
let highlightEdges = null; // set of edge indices to highlight

function redraw() {
    const w = canvas.width / dpr;
    const h = canvas.height / dpr;
    ctx.clearRect(0, 0, w, h);

    // Grid dots (subtle)
    ctx.fillStyle = '#1a1a24';
    for (let gx = 20; gx < w; gx += 40) {
        for (let gy = 20; gy < h; gy += 40) {
            ctx.beginPath();
            ctx.arc(gx, gy, 1, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // Edges
    edges.forEach((e, idx) => {
        const a = vertices[e.v1], b = vertices[e.v2];
        if (!a || !b) return;
        const isHighlight = highlightEdges && highlightEdges.has(idx);
        const color = isHighlight ? '#00cec9' : '#3a3a50';
        const lw = isHighlight ? 2.5 : 1.5;

        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = lw;
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();

        // Weight label
        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        // Background
        ctx.fillStyle = 'rgba(10, 10, 15, 0.8)';
        const tw = ctx.measureText(e.weight + '').width;
        ctx.fillRect(mx - tw / 2 - 4, my - 8, tw + 8, 16);
        ctx.fillStyle = isHighlight ? '#fdcb6e' : '#fdcb6e';
        ctx.font = '600 11px "JetBrains Mono"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(e.weight, mx, my);
    });

    // Vertices
    vertices.forEach((v, i) => {
        const isSelected = (mode === 'edge' && selectedVertex === i);
        const r = 16;

        // Glow if selected
        if (isSelected) {
            ctx.beginPath();
            ctx.arc(v.x, v.y, r + 6, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(108, 92, 231, 0.2)';
            ctx.fill();
        }

        // Circle
        ctx.beginPath();
        ctx.arc(v.x, v.y, r, 0, Math.PI * 2);
        ctx.fillStyle = isSelected ? '#6c5ce7' : '#1a1a24';
        ctx.fill();
        ctx.strokeStyle = isSelected ? '#a29bfe' : '#6c5ce7';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Label
        ctx.fillStyle = isSelected ? '#fff' : '#a29bfe';
        ctx.font = '700 12px "JetBrains Mono"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(i, v.x, v.y);
    });
}

// ===== UI UPDATES =====
function updateCounts() {
    document.getElementById('vertex-count').textContent = `Vértices: ${vertices.length}`;
    document.getElementById('edge-count').textContent = `Aristas: ${edges.length}`;
    document.getElementById('info-vertices').textContent = `V = ${vertices.length}`;
    document.getElementById('info-edges').textContent = `E = ${edges.length}`;
}

function updateEdgeList() {
    const container = document.getElementById('edge-list-items');
    const panel = document.getElementById('edge-list');
    container.innerHTML = '';
    if (edges.length === 0) {
        panel.classList.add('empty');
        return;
    }
    panel.classList.remove('empty');
    edges.forEach(e => {
        const div = document.createElement('div');
        div.className = 'edge-item';
        div.innerHTML = `<span>${e.v1} ↔ ${e.v2}</span><span class="weight">${e.weight}</span>`;
        container.appendChild(div);
    });
}

// ===== HAMILTONIAN CYCLE (brute force with permutations) =====
function permutations(arr) {
    if (arr.length <= 1) return [arr];
    const result = [];
    for (let i = 0; i < arr.length; i++) {
        const rest = [...arr.slice(0, i), ...arr.slice(i + 1)];
        for (const perm of permutations(rest)) {
            result.push([arr[i], ...perm]);
        }
    }
    return result;
}

function findHamiltonianCycle() {
    if (vertices.length < 3) {
        alert('Se necesitan al menos 3 vértices');
        return;
    }

    // Build adjacency matrix
    const n = vertices.length;
    const adj = Array.from({ length: n }, () => Array(n).fill(0));
    edges.forEach(e => {
        adj[e.v1][e.v2] = e.weight;
        adj[e.v2][e.v1] = e.weight;
    });

    // Fix last vertex, permute the rest
    const last = n - 1;
    const others = [];
    for (let i = 0; i < last; i++) others.push(i);

    const perms = permutations(others);
    let bestCost = Infinity;
    let bestPath = null;

    for (const perm of perms) {
        // Path: last -> perm[0] -> perm[1] -> ... -> last
        const path = [last, ...perm, last];
        let cost = 0;
        let valid = true;
        for (let i = 0; i < path.length - 1; i++) {
            const w = adj[path[i]][path[i + 1]];
            if (w === 0) { valid = false; break; }
            cost += w;
        }
        if (valid && cost < bestCost) {
            bestCost = cost;
            bestPath = path;
        }
    }

    const bar = document.getElementById('result-bar');
    if (!bestPath) {
        bar.classList.remove('hidden', 'success');
        document.getElementById('result-path').textContent = 'No existe ciclo hamiltoniano';
        document.getElementById('result-length').textContent = '—';
        highlightEdges = null;
        redraw();
        return;
    }

    // Format path
    const pathStr = bestPath.join(' → ');

    // Highlight edges in the path
    highlightEdges = new Set();
    for (let i = 0; i < bestPath.length - 1; i++) {
        const a = bestPath[i], b = bestPath[i + 1];
        edges.forEach((e, idx) => {
            if ((e.v1 === a && e.v2 === b) || (e.v1 === b && e.v2 === a)) {
                highlightEdges.add(idx);
            }
        });
    }

    bar.classList.remove('hidden');
    bar.classList.add('success');
    document.getElementById('result-path').textContent = pathStr;
    document.getElementById('result-length').textContent = bestCost;

    const dot = document.getElementById('status-dot');
    const text = document.getElementById('status-text');
    dot.className = 'status-indicator green';
    text.innerHTML = `<strong>Resultado encontrado</strong> — Ciclo hamiltoniano con costo mínimo: ${bestCost}`;

    redraw();
}

// Init
updateCounts();
</script>
</body>
</html>
